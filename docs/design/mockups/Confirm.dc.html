<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>aistats 항목 덮어쓰기 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#07060D}
a{color:#00F0FF}a:hover{color:#7DF9FF}
button{font:inherit;cursor:pointer}
.cut{clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px))}
.cut-s{clip-path:polygon(0 0,calc(100% - 7px) 0,100% 7px,100% 100%,7px 100%,0 calc(100% - 7px))}
.hazard{background-image:repeating-linear-gradient(135deg,#FFB000 0 8px,#07060D 8px 16px)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px)}
</style>
</helmet>
<div style="position: relative; width: 460px; height: 400px; box-sizing: border-box; padding: 24px; background-color: rgba(7,6,13,.9); display: flex; align-items: center; justify-content: center; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #E8E6F5;">
  <section class="cut" role="alertdialog" aria-labelledby="dlg-title" style="width: 412px; background: #0E0C1A; border: 1px solid #FFB000; box-shadow: 0 0 30px rgba(255,176,0,.25); display: flex; flex-direction: column;">
    <div class="hazard" style="height: 6px;" aria-hidden="true"></div>
    <div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #FFB000;">
        <span>// OVERWRITE</span><span style="flex-grow: 1; height: 1px; background: linear-gradient(90deg, rgba(255,176,0,.6), transparent);"></span>
      </div>
      <h2 id="dlg-title" style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.35;">Claude Desktop의 aistats 항목을 바꿀까요?</h2>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #C9C6E4;">이미 등록된 명령을 이 앱의 aistats로 덮어씁니다.</p>
      <dl class="cut-s" style="margin: 0; padding: 10px 12px; background: rgba(0,240,255,.05); border: 1px solid rgba(0,240,255,.25); display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; font-size: 12px;">
        <dt style="color: #9A97B8;">현재 항목</dt>
        <dd style="margin: 0; font-family: 'JetBrains Mono', monospace; color: #E8E6F5; overflow-wrap: anywhere;">/opt/tools/aistats-old mcp</dd>
        <dt style="color: #9A97B8;">항목 지문</dt>
        <dd style="margin: 0; font-family: 'JetBrains Mono', monospace; color: #00F0FF; letter-spacing: 1px;">3f9a0c1e7b42</dd>
      </dl>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; line-height: 1.5; color: #C9C6E4;">
        <li style="display: flex; gap: 8px;"><span style="color: #FFB000; font-family: 'JetBrains Mono', monospace;">&gt;</span><span>그사이 항목이 바뀌면 덮어쓰지 않습니다.</span></li>
        <li style="display: flex; gap: 8px;"><span style="color: #FFB000; font-family: 'JetBrains Mono', monospace;">&gt;</span><span>바꾸기 전 설정 파일을 AIStats 데이터 폴더(backups)에 백업합니다.</span></li>
      </ul>
      <div style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 4px;">
        <button class="cut-s" style="height: 30px; padding: 0 16px; background: transparent; border: 1px solid rgba(154,151,184,.5); color: #C9C6E4; font-size: 12px;">취소</button>
        <button class="cut-s" style="height: 30px; padding: 0 16px; background: #FFB000; border: 0; color: #07060D; font-size: 12px; font-weight: 700; box-shadow: 0 0 14px rgba(255,176,0,.5);">덮어쓰기</button>
      </div>
    </div>
  </section>
  <div class="scan"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":460,"height":400}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
