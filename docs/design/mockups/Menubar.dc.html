<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>AIStats 메뉴바 표시</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Noto+Sans+KR:wght@400;500;700&amp;display=swap">
<style>
body{margin:0;background:#07060D}
a{color:#00F0FF}a:hover{color:#7DF9FF}
.grid{background-image:linear-gradient(rgba(0,240,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,.045) 1px,transparent 1px);background-size:20px 20px}
.mini{background-image:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 4px)}
@keyframes blink{50%{opacity:.3}}
.blink{animation:blink 1.2s steps(2) infinite}
</style>
</helmet>
<div class="grid" style="width: 880px; height: 300px; box-sizing: border-box; padding: 28px 32px; background-color: #07060D; color: #E8E6F5; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px;">

  <div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: 2px; color: #FF2A6D;">
    <span>// MENU BAR</span><span style="flex-grow: 1; height: 1px; background: linear-gradient(90deg, rgba(255,42,109,.6), transparent);"></span>
  </div>

  <div style="display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 18px 20px; align-items: center;">

    <span style="font-size: 12px; color: #9A97B8;">평상시</span>
    <div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; background: rgba(30,28,44,.85); border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; color: #E8E6F5;">
      <span style="display: flex; align-items: center; gap: 7px; padding: 3px 8px; border: 1px solid rgba(0,240,255,.45); background: rgba(0,240,255,.06);">
        <span style="font-family: Orbitron, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #00F0FF;">CPU</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #00F0FF;">23%</span>
        <span style="width: 32px; height: 8px; background: repeating-linear-gradient(90deg, #2A2547 0 3px, transparent 3px 4px); position: relative;"><span class="mini" style="position: absolute; inset: 0 auto 0 0; width: 25%; color: #00F0FF;"></span></span>
      </span>
      <span style="color: #9A97B8; font-size: 12px;">11월 19일 (목) 오후 2:02</span>
    </div>

    <span style="font-size: 12px; color: #9A97B8;">에이전트가 조회 중</span>
    <div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; background: rgba(30,28,44,.85); border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; color: #E8E6F5;">
      <span style="display: flex; align-items: center; gap: 7px; padding: 3px 8px; border: 1px solid #FF2A6D; background: rgba(255,42,109,.10); box-shadow: 0 0 10px rgba(255,42,109,.4);">
        <span class="blink" style="width: 6px; height: 6px; background: #FF2A6D; transform: rotate(45deg); box-shadow: 0 0 6px #FF2A6D;" aria-hidden="true"></span>
        <span style="font-family: Orbitron, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #FF5C8D;">AI</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #00F0FF;">41%</span>
        <span style="width: 32px; height: 8px; background: repeating-linear-gradient(90deg, #2A2547 0 3px, transparent 3px 4px); position: relative;"><span class="mini" style="position: absolute; inset: 0 auto 0 0; width: 41%; color: #00F0FF;"></span></span>
      </span>
      <span style="color: #9A97B8; font-size: 12px;">11월 19일 (목) 오후 2:02</span>
    </div>

    <span style="font-size: 12px; color: #9A97B8;">경고</span>
    <div style="height: 30px; display: flex; align-items: center; justify-content: flex-end; gap: 18px; padding: 0 14px; background: rgba(30,28,44,.85); border-bottom: 1px solid rgba(255,255,255,.06); font-size: 13px; color: #E8E6F5;">
      <span style="display: flex; align-items: center; gap: 7px; padding: 3px 8px; border: 1px solid #FFB000; background: rgba(255,176,0,.12); box-shadow: 0 0 10px rgba(255,176,0,.4);">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFB000" stroke-width="2.4" aria-hidden="true"><path d="M12 3 2 21h20L12 3z"></path><path d="M12 10v5"></path></svg>
        <span style="font-family: Orbitron, sans-serif; font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #FFB000;">MEM</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #FFB000;">94%</span>
        <span style="width: 32px; height: 8px; background: repeating-linear-gradient(90deg, #2A2547 0 3px, transparent 3px 4px); position: relative;"><span class="mini" style="position: absolute; inset: 0 auto 0 0; width: 94%; color: #FFB000;"></span></span>
      </span>
      <span style="color: #9A97B8; font-size: 12px;">11월 19일 (목) 오후 2:02</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":300}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
